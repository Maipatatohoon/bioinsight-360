<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Navbar 3 — Minimal + CTA</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#0f172a;background:#fff}
.nav{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,232,240,.45)}
.brand{font-weight:800;letter-spacing:-.02em}.brand span{color:#2563eb}
.links{display:flex;align-items:center;gap:24px}
.a{color:#475569;font-weight:500;font-size:14px;text-decoration:none}
.a:hover{color:#2563eb}
.a.active{color:#2563eb;font-weight:700}
.cta{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;font-weight:700;font-size:14px;padding:10px 20px;border-radius:10px;text-decoration:none;box-shadow:0 10px 24px -10px rgba(37,99,235,.75)}
.body{max-width:960px;margin:0 auto;padding:40px 28px;color:#64748b}
</style></head>
<body>
<nav class="nav">
  <div class="brand">Bio<span>Insight</span> 360</div>
  <div class="links">
    <a class="a" href="#">Upload</a><a class="a" href="#">QC</a><a class="a active" href="#">Consensus</a><a class="a" href="#">Pathways</a><a class="a" href="#">Export</a>
    <a class="cta" href="#">Start &rarr;</a>
  </div>
</nav>
<div class="body">Variant 3 — the most minimal: no pills or lines at all. Active page is just bold blue; the gradient Start button carries the colour.</div>
</body></html>
